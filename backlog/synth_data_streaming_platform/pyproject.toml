[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-streaming-data"
version = "0.1.0"
description = "Reproducible simulation-based data for a hypothetical streaming platform"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
