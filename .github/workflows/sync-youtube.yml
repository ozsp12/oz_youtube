name: Sync YouTube metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/sync-youtube.yml"

concurrency:
  group: youtube-metadata-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate YouTube API secret
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY is not configured in repository Actions secrets."
            exit 1
          fi

      - name: Extract YouTube metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/extrair_videos_youtube.py --modo api --saida data/videos_canal_youtube.xlsx

      - name: Commit generated workbook
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main advanced; regenerating workbook on latest origin/main."
              git reset --hard origin/main
              python src/extrair_videos_youtube.py --modo api --saida data/videos_canal_youtube.xlsx
            fi

            git add data/videos_canal_youtube.xlsx

            if git diff --cached --quiet; then
              echo "Workbook is already up to date."
              exit 0
            fi

            git commit -m "Update YouTube metadata workbook"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed because main advanced; regenerating."
          done

          echo "Unable to push generated workbook after 3 attempts."
          exit 1
