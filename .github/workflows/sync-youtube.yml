name: Sync YouTube catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/sync-youtube.yml"

concurrency:
  group: youtube-catalog-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate YouTube API secret
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY is not configured in repository Actions secrets."
            exit 1
          fi

      - name: Extract YouTube metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/extrair_videos_youtube.py --modo api --saida data/videos_canal_youtube.xlsx

      - name: Update README catalog
        run: python src/gerar_readme.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/videos_canal_youtube.xlsx videos/
          git diff --cached --quiet && exit 0
          git commit -m "Update YouTube catalog"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed because main advanced; retrying."
          done

          echo "Unable to push generated catalog after 3 attempts."
          exit 1
